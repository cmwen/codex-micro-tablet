name: Build and deploy Astro site to GitHub Pages

on:
  release:
    types: [published]
  # GITHUB_TOKEN-created releases do not trigger release workflows. Completion does.
  workflow_run:
    workflows: [Flutter Release, Flutter Pre-Release & Beta]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  release-ref:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      # Never check out or execute workflow_run code until a published release is verified.
      - name: Resolve published release commit
        id: resolve
        uses: actions/github-script@v9
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('ref', context.sha);
              return;
            }
            if (context.eventName === 'release') {
              const commit = await github.rest.repos.getCommit({
                ...context.repo, ref: context.payload.release.tag_name
              });
              core.setOutput('ref', commit.data.sha);
              return;
            }
            const run = context.payload.workflow_run;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              ...context.repo, per_page: 100
            });
            for (const release of releases) {
              if (release.draft || !release.published_at ||
                  Date.parse(release.published_at) < Date.parse(run.run_started_at)) continue;
              const commit = await github.rest.repos.getCommit({
                ...context.repo, ref: release.tag_name
              });
              if (commit.data.sha === run.head_sha) {
                core.setOutput('ref', commit.data.sha);
                return;
              }
            }
            core.info('No published release matches this successful run; skipping Pages deployment.');

  build:
    needs: release-ref
    if: needs.release-ref.outputs.ref != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-ref.outputs.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'astro/package-lock.json'

      - name: Install and build optional website
        working-directory: astro
        run: |
          npm ci --prefer-offline
          npm run build

      - name: Upload static build
        uses: actions/upload-pages-artifact@v5
        with:
          path: astro/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
