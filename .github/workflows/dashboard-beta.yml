name: Dashboard beta artifact
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  beta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - run: bash scripts/check-hid-protocol.sh
      - run: flutter build apk --debug --build-name=0.2.0-beta.1 --build-number=2
      - uses: actions/upload-artifact@v7
        with:
          name: codex-micro-tablet-beta-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
